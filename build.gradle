plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.11'
}

group = 'dev.meteorpurple'
version = '1.0.0'
base { archivesName = 'meteor-purple-edition' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.meteordev.org/releases' }
    maven { url = 'https://maven.meteordev.org/snapshots' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.2'
    implementation 'net.fabricmc:fabric-loader:0.19.3'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.154.2+26.2'
    implementation 'meteordevelopment:meteor-client:26.2-20261009.074120-35'
    implementation 'maven.modrinth:3Q35hPRA:TAH6i1zw'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar { from('LICENSE') { rename { 'LICENSE_meteor-purple-edition' } } }
